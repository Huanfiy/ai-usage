[workspace]
resolver = "2"
members = ["crates/protocol", "crates/parsers", "crates/agent", "crates/dash"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
ai-usage-protocol = { path = "crates/protocol" }
ai-usage-parsers = { path = "crates/parsers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
