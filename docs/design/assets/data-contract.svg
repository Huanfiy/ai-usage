<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
  <title id="title">数据契约：本地归一化为 Bucket 与 Session</title>
  <desc id="desc">采集端在本地把工具日志收成 30 分钟用量窗和会话元数据。cache 读与 cache 写分字段。上报不含 prompt、补全、源码。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1100" height="400" rx="20" fill="#f8fafc"/>
  <text x="40" y="42" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="20" font-weight="700" fill="#0f172a">数据契约 · 双轨归一化</text>
  <text x="40" y="64" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="13" fill="#64748b">看板处理的是已归一化统计，不是原始会话文件。schema_version = 1。</text>

  <g filter="url(#shadow)">
    <rect x="40" y="88" width="240" height="276" rx="14" fill="#fff" stroke="#e2e8f0"/>
  </g>
  <text x="60" y="118" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#475569">各工具本地形态</text>
  <rect x="60" y="136" width="200" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="160" y="158" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#0f172a">Claude Code</text>
  <text x="160" y="176" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">JSONL 会话</text>
  <rect x="60" y="200" width="200" height="56" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="160" y="222" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#0f172a">Codex</text>
  <text x="160" y="240" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">sessions / archived</text>
  <rect x="60" y="264" width="200" height="72" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="160" y="290" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" font-weight="600" fill="#0f172a">Grok</text>
  <text x="160" y="308" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">updates.jsonl</text>
  <text x="160" y="324" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">summary.json</text>

  <line x1="280" y1="226" x2="340" y2="226" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="310" y="210" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">本机解析</text>

  <g filter="url(#shadow)">
    <rect x="340" y="88" width="360" height="132" rx="14" fill="#fff" stroke="#bfdbfe"/>
  </g>
  <text x="360" y="116" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Bucket · 30 min 用量窗</text>
  <text x="360" y="138" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#64748b">source · model · project · bucket_start</text>
  <text x="360" y="168" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#0f172a">input / output / reasoning</text>
  <text x="360" y="188" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#1d4ed8">cache_read 与 cache_creation 分字段</text>
  <text x="360" y="206" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">Anthropic 读写单价差 12.5 倍，合并后费用无法回补</text>

  <g filter="url(#shadow)">
    <rect x="340" y="232" width="360" height="132" rx="14" fill="#fff" stroke="#fed7aa"/>
  </g>
  <text x="360" y="260" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#c2410c">Session · 交互元数据</text>
  <text x="360" y="282" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#64748b">source · project · session_hash</text>
  <text x="360" y="312" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#0f172a">首末时间 · 持续 / 活跃秒数</text>
  <text x="360" y="332" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#0f172a">message_count · user_message_count</text>
  <text x="360" y="350" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">无 prompt、无补全、无源码、无完整路径</text>

  <line x1="700" y1="154" x2="760" y2="154" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="700" y1="298" x2="760" y2="298" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="760" y="88" width="300" height="276" rx="14" fill="#fff" stroke="#ddd6fe"/>
  </g>
  <text x="780" y="118" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="13" font-weight="700" fill="#5b21b6">上报信封</text>
  <text x="780" y="140" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#6d28d9">POST /v1/ingest</text>
  <rect x="780" y="156" width="260" height="176" rx="10" fill="#f5f3ff"/>
  <text x="800" y="182" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b21b6">schema_version</text>
  <text x="800" y="206" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b21b6">hostname（显示名）</text>
  <text x="800" y="230" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b21b6">agent_version</text>
  <text x="800" y="254" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b21b6">buckets[]</text>
  <text x="800" y="278" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="12" fill="#5b21b6">sessions[]</text>
  <text x="800" y="314" font-family="system-ui,-apple-system,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif" font-size="11" fill="#64748b">未知 source 软丢弃，不 400 整批</text>
</svg>
