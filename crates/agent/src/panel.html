<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Usage · 采集端</title>
  <style>
    :root {
      --bg: #0b0e12;
      --bg-elev: #12171e;
      --bg-elev-2: #181e27;
      --line: #273040;
      --text: #e7edf5;
      --muted: #8b97a8;
      --mint: #3ee0b3;
      --mint-dim: #1a4f42;
      --amber: #e8b15a;
      --rose: #e07a7a;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      font-family: "IBM Plex Sans", "Noto Sans CJK SC", "Source Han Sans SC", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    button, input, textarea, select { font: inherit; color: inherit; }
    button {
      cursor: pointer;
      transition: background 40ms ease-out, border-color 40ms ease-out, color 40ms ease-out,
        transform 50ms ease-out, box-shadow 40ms ease-out, opacity 40ms ease-out;
    }
    button:disabled { cursor: not-allowed; }
    .app { max-width: 1080px; margin: 0 auto; padding: 16px 24px 56px; }
    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .brand h1 span { color: var(--mint); }
    .brand p { margin: 0; color: var(--muted); font-size: 12px; }
    .brand p code {
      font-family: ui-monospace, "IBM Plex Mono", "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--text);
    }
    .nav { display: flex; align-items: center; gap: 10px; }
    .nav .msg { margin: 0; min-height: 0; }
    .nav .msg:empty { display: none; }
    .btn {
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
    }
    .btn:hover:not(:disabled) {
      border-color: #3d4b5e;
      background: #1c2430;
      color: var(--text);
    }
    .btn.primary {
      border-color: var(--mint);
      color: var(--mint);
      background: var(--mint-dim);
    }
    .btn.primary:hover:not(:disabled) {
      border-color: var(--mint);
      background: #226355;
      color: #7aecd0;
    }
    .btn.ghost { background: transparent; }
    .btn.ghost:hover:not(:disabled) {
      background: #1c2430;
      border-color: #3d4b5e;
    }
    .btn.danger {
      border-color: #5a3030;
      color: var(--rose);
      background: transparent;
    }
    .btn.danger:hover:not(:disabled) {
      border-color: var(--rose);
      background: #3a2222;
      color: #f09a9a;
    }
    .btn.primary:active:not(:disabled),
    .btn.danger:active:not(:disabled) {
      transform: scale(0.96);
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .kpis-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .kpi {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 0;
    }
    .kpi-sync { flex: 0 1 260px; }
    .kpi-tools { flex: 0 0 auto; position: relative; z-index: 2; }
    .kpi .label { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; }
    .sync-lines {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 6px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .sync-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .sync-line .k {
      color: var(--muted);
      width: 46px;
      flex-shrink: 0;
      font-size: 12px;
    }
    .sync-line .t { color: var(--text); }
    .sync-line.idle .t { color: var(--muted); }
    .sync-line.err .t { color: var(--rose); }
    .tool-icons { display: flex; gap: 6px; margin-top: 6px; }
    .tool {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--bg-elev-2);
      color: var(--muted);
      display: grid;
      place-items: center;
      opacity: 0.34;
      filter: grayscale(1);
    }
    .tool svg, .tool img { width: 22px; height: 22px; display: block; object-fit: contain; }
    .tool.on { opacity: 1; filter: none; }
    .tool::after {
      content: attr(data-tip);
      position: absolute;
      left: 50%;
      bottom: calc(100% + 8px);
      transform: translateX(-50%) translateY(4px);
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(11, 14, 18, 0.94);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.06s ease, transform 0.06s ease;
      transition-delay: 0s;
    }
    .tool:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      transition-delay: 0.08s;
    }
    .card {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .card h2, .card-head h2 {
      margin: 0;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .plus {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1px solid var(--mint);
      background: var(--mint-dim);
      color: var(--mint);
      padding: 0;
      display: grid;
      place-items: center;
    }
    .plus:hover:not(:disabled) {
      background: #226355;
      color: #7aecd0;
      box-shadow: 0 0 0 3px rgba(62, 224, 179, 0.16);
    }
    .plus:active:not(:disabled) {
      box-shadow: none;
    }
    .plus svg { width: 16px; height: 16px; display: block; }
    .acct-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }
    .acct {
      background: var(--bg-elev-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 176px;
    }
    .acct-top { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .acct-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .acct-email {
      font-size: 14px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }
    .acct-tools { display: flex; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg-elev);
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
      padding: 0;
      display: grid;
      place-items: center;
    }
    .icon-btn:hover:not(:disabled) {
      color: var(--mint);
      border-color: var(--mint);
      background: #1c2430;
    }
    .icon-btn:active:not(:disabled) {
      background: #161c24;
    }
    .icon-btn svg { width: 15px; height: 15px; display: block; }
    .icon-btn.spin svg { animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon-btn.pulse {
      color: var(--mint);
      border-color: var(--mint);
      transition: color 40ms ease-out, border-color 40ms ease-out, background 40ms ease-out;
      animation: json-breathe 0.75s ease-in-out 2;
    }
    @keyframes json-breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(62, 224, 179, 0); }
      50% { box-shadow: 0 0 0 6px rgba(62, 224, 179, 0.32); }
    }
    @media (prefers-reduced-motion: reduce) {
      .icon-btn.pulse { animation: none; }
    }
    .json-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .json-head h3 { margin: 0 0 4px; }
    .json-head .dlg-lead { margin: 0; }
    .acct-json {
      margin: 0;
      padding: 12px;
      background: #0b0e12;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      overflow: auto;
      max-height: min(70vh, 560px);
      color: var(--text);
      font-family: ui-monospace, "IBM Plex Mono", "SF Mono", Menlo, monospace;
      white-space: pre;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line);
      background: var(--bg-elev);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      color: var(--muted);
    }
    .chip.on { border-color: var(--mint); color: var(--mint); background: var(--mint-dim); }
    .chip.warn { border-color: #5a4630; color: var(--amber); }
    .chip.bad { border-color: #5a3030; color: var(--rose); }
    .usage { display: flex; flex-direction: column; gap: 8px; }
    .usage .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .usage .row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
    .bar {
      height: 6px;
      background: #1c2430;
      border-radius: 99px;
      overflow: hidden;
    }
    .bar > i { display: block; height: 100%; width: 0; background: var(--mint); }
    .bar.warn > i { background: var(--amber); }
    .bar.hot > i { background: var(--rose); }
    .meta { color: var(--muted); font-size: 12px; }
    .acct-foot {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .empty {
      color: var(--muted);
      padding: 28px 8px;
      text-align: center;
      font-size: 13px;
      grid-column: 1 / -1;
    }
    label.field { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    .fields {
      display: grid;
      grid-template-columns: minmax(140px, 0.7fr) minmax(200px, 1.3fr);
      gap: 8px 12px;
    }
    .fields.even { grid-template-columns: 1fr 1fr; }
    .fields.triple {
      grid-template-columns: minmax(140px, 1.2fr) minmax(100px, 0.7fr) minmax(100px, 0.7fr);
    }
    .fields + .fields { margin-top: 8px; }
    .fields label.field { margin: 0; }
    .dest-label { margin: 10px 0 6px; font-size: 12px; color: var(--muted); }
    .dest-list { display: flex; flex-direction: column; gap: 8px; }
    .dest-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .dest-row .dest-url { flex: 1.4 1 160px; min-width: 0; }
    .dest-row .dest-token { flex: 1 1 120px; min-width: 0; }
    .dest-row .icon-btn { flex-shrink: 0; }
    .card-cfg { padding: 12px 14px; }
    .card-cfg .card-head { margin-bottom: 8px; }
    .card-cfg label.field input {
      display: block;
      margin-top: 4px;
    }
    .cfg-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      background: var(--bg-elev-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      color-scheme: dark;
    }
    textarea {
      min-height: 96px;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      resize: vertical;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 140px; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .msg { min-height: 1.2em; margin-top: 8px; color: var(--muted); font-size: 12px; }
    .card-cfg .msg:empty { display: none; }
    .msg.err { color: var(--rose); }
    .msg.ok { color: var(--mint); }
    .err { color: var(--rose); font-size: 13px; margin-bottom: 12px; }
    dialog {
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      max-width: 520px;
      width: calc(100% - 32px);
    }
    dialog.wide { max-width: 760px; }
    dialog::backdrop { background: rgba(5, 8, 12, 0.72); }
    .dlg-card {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow);
    }
    .dlg-card h3 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 600;
    }
    .dlg-lead { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
    .drop {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      min-height: 72px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      background: var(--bg-elev-2);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: background 40ms ease-out, border-color 40ms ease-out, color 40ms ease-out;
    }
    .drop:hover {
      border-color: #3d4b5e;
      background: #1c2430;
      color: var(--text);
    }
    .drop:active {
      border-color: var(--mint);
      color: var(--mint);
    }
    .drop.over { border-color: var(--mint); color: var(--mint); }
    .drop input { display: none; }
    .dlg-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 14px;
    }
    .grow { flex: 1; }
    @media (max-width: 640px) {
      .top { flex-direction: column; align-items: flex-start; }
      .kpi-sync { flex: 1 1 100%; }
      .fields, .fields.even, .fields.triple { grid-template-columns: 1fr; }
      .dest-row { flex-wrap: wrap; }
      .dest-row .dest-url, .dest-row .dest-token { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <h1>AI <span>Usage</span></h1>
        <p>采集端 · 凭证只留本机 · <code id="kpi-panel">—</code></p>
      </div>
      <nav class="nav">
        <span class="msg" id="sync-msg"></span>
        <button type="button" class="btn primary" id="sync-now">立即同步</button>
      </nav>
    </header>
    <p class="err" id="page-err" hidden></p>
    <section class="kpis-row">
      <div class="kpi kpi-sync">
        <div class="label">上次同步</div>
        <div class="sync-lines" id="kpi-sync">
          <div class="sync-line idle"><span class="k">agent</span><span class="t">尚未同步</span></div>
          <div class="sync-line idle"><span class="k">cursor</span><span class="t">尚未同步</span></div>
        </div>
      </div>
      <div class="kpi kpi-tools">
        <div class="label">本机工具</div>
        <div class="tool-icons" id="tools"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Cursor 账号</h2>
        <button type="button" class="plus" id="add-open" title="添加账号" aria-label="添加账号">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14"/><path d="M5 12h14"/>
          </svg>
        </button>
      </div>
      <div class="acct-grid" id="accounts"></div>
      <div class="msg" id="acct-msg"></div>
    </section>

    <section class="card card-cfg">
      <div class="card-head">
        <h2>上报</h2>
        <button type="button" class="plus" id="add-dest" title="添加看板地址" aria-label="添加看板地址">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14"/><path d="M5 12h14"/>
          </svg>
        </button>
      </div>
      <div class="fields triple">
        <label class="field" for="hostname">主机显示名
          <input id="hostname" type="text" autocomplete="off" />
        </label>
        <label class="field" for="interval_local">本地工具间隔
          <input id="interval_local" type="text" placeholder="5m" title="按钟面对齐，5m 在 :00/:05/:10 上报" />
        </label>
        <label class="field" for="interval_cursor">Cursor 间隔
          <input id="interval_cursor" type="text" placeholder="30m" title="按钟面对齐，30m 在 :00/:30 上报" />
        </label>
      </div>
      <div class="dest-label">看板地址</div>
      <div class="dest-list" id="dests"></div>
      <div class="cfg-foot">
        <label class="check"><input id="upload_project" type="checkbox" /> 上报项目路径</label>
        <div class="actions">
          <button type="button" class="btn primary" id="save-cfg">保存配置</button>
        </div>
      </div>
      <div class="msg" id="cfg-msg"></div>
    </section>
  </div>

  <dialog id="json-dlg" class="wide">
    <div class="dlg-card">
      <div class="json-head">
        <div>
          <h3 id="json-title">usage-summary</h3>
          <p class="dlg-lead" id="json-sub">GET /api/usage-summary</p>
        </div>
        <button type="button" class="icon-btn" id="json-close" title="关闭" aria-label="关闭"></button>
      </div>
      <pre class="acct-json" id="json-body"></pre>
    </div>
  </dialog>

  <dialog id="add-dlg">
    <form class="dlg-card" id="add-form">
      <h3>添加 Cursor 账号</h3>
      <p class="dlg-lead">粘贴 JWT / WorkosCursorSessionToken，或上传账号导出 JSON（提取 access_token）。</p>
      <label class="field" for="token">粘贴凭证</label>
      <textarea id="token" placeholder="eyJ… 或 sub::eyJ… 或 JSON 数组"></textarea>
      <label class="drop" id="drop">
        <input id="file" type="file" accept=".json,application/json,text/plain,application/octet-stream" />
        <span id="file-label">点击或拖放 JSON 文件到这里</span>
      </label>
      <div class="dlg-actions">
        <button type="button" class="btn ghost" id="import-ide">导入当前 IDE 登录</button>
        <span class="grow"></span>
        <button type="button" class="btn ghost" id="add-cancel">取消</button>
        <button type="submit" class="btn primary" id="add-submit">添加</button>
      </div>
      <div class="msg" id="dlg-msg"></div>
    </form>
  </dialog>

  <script>
    const $ = (id) => document.getElementById(id);
    let fileText = "";
    let fileName = "";
    let lastStatus = null;
    let jsonHash = null;
    let cfgDirty = false;
    let destsDirty = false;
    const usageFp = new Map();
    const usagePulseUntil = new Map();
    const usageForcePulse = new Set();
    const ICONS = {
      refresh: [
        "M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8",
        "M21 3v5h-5",
        "M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16",
        "M8 16H3v5",
      ],
      braces: [
        "M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1",
        "M16 3h1a2 2 0 0 1 2 2v5a2 2 0 0 0 2 2 2 2 0 0 0-2 2v5a2 2 0 0 1-2 2h-1",
      ],
      x: ["M18 6 6 18", "M6 6l12 12"],
    };
    const TOOL_MARKS = {
      "claude-code": "Claude Code",
      codex: "Codex",
      grok: "Grok",
      cursor: "Cursor",
    };

    function fmtExp(exp) {
      if (!exp) return { text: "到期时间未知", kind: "" };
      const ms = exp * 1000 - Date.now();
      const days = Math.floor(ms / 86400000);
      const when = new Date(exp * 1000).toISOString().slice(0, 10);
      if (ms <= 0) return { text: "已过期 · " + when, kind: "bad" };
      if (days <= 7) return { text: "剩余 " + days + " 天 · " + when, kind: "warn" };
      return { text: "剩余 " + days + " 天 · " + when, kind: "" };
    }
    function fmtPct(n) {
      if (n == null || Number.isNaN(n)) return "—";
      return (Math.round(n * 10) / 10) + "%";
    }
    function fmtUsd(cents) {
      if (cents == null || Number.isNaN(Number(cents))) return null;
      return "$" + (Number(cents) / 100).toFixed(2);
    }
    function meter(label, pct) {
      if (pct == null) return null;
      const box = el("div", "meter");
      const row = el("div", "row");
      row.appendChild(el("span", "", label));
      row.appendChild(el("b", "", fmtPct(pct)));
      box.appendChild(row);
      const bar = el("div", "bar" + (pct >= 90 ? " hot" : pct >= 70 ? " warn" : ""));
      const i = el("i");
      i.style.width = Math.max(0, Math.min(100, pct)) + "%";
      bar.appendChild(i);
      box.appendChild(bar);
      return box;
    }
    function setMsg(id, text, kind) {
      const el = $(id);
      el.textContent = text || "";
      el.className = "msg" + (kind ? " " + kind : "");
    }
    async function api(path, opts) {
      const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, opts));
      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch (e) { data = { error: text }; }
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }
    function el(tag, cls, text) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }
    function svgIcon(paths) {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "1.8");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.setAttribute("aria-hidden", "true");
      paths.forEach((d) => {
        const p = document.createElementNS(ns, "path");
        p.setAttribute("d", d);
        svg.appendChild(p);
      });
      return svg;
    }
    function iconBtn(name, title) {
      const btn = el("button", "icon-btn");
      btn.type = "button";
      btn.title = title;
      btn.setAttribute("aria-label", title);
      btn.appendChild(svgIcon(ICONS[name]));
      return btn;
    }
    function fmtWhen(iso) {
      if (!iso) return "尚未同步";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso.replace("T", " ").slice(0, 19);
      const pad = (n) => String(n).padStart(2, "0");
      const hm = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
      const now = new Date();
      const sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
      if (sameDay) return hm;
      return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + hm;
    }
    function syncLine(label, ls) {
      const line = el("div", "sync-line" + (!ls ? " idle" : ls.error ? " err" : ""));
      line.appendChild(el("span", "k", label));
      const t = el("span", "t", ls ? fmtWhen(ls.at) : "尚未同步");
      if (ls && ls.error) t.title = ls.error;
      line.appendChild(t);
      return line;
    }
    function toolMark(t) {
      const label = TOOL_MARKS[t.id] || t.id;
      const wrap = el("div", "tool" + (t.found ? " on" : ""));
      wrap.dataset.tip = label + (t.found ? "" : " · 未发现");
      wrap.setAttribute("aria-label", wrap.dataset.tip);
      const img = document.createElement("img");
      img.src = "/icons/" + encodeURIComponent(t.id) + ".svg";
      img.alt = "";
      img.width = 22;
      img.height = 22;
      wrap.appendChild(img);
      return wrap;
    }
    function usageFingerprint(a) {
      return a.usage_raw ? JSON.stringify(a.usage_raw) : "";
    }
    function markUsagePulse(hash, fp) {
      const prev = usageFp.get(hash);
      usageFp.set(hash, fp);
      const forced = usageForcePulse.delete(hash);
      if (forced || (prev !== undefined && prev !== fp)) {
        usagePulseUntil.set(hash, Date.now() + 2000);
      }
      const until = usagePulseUntil.get(hash) || 0;
      if (Date.now() < until) return true;
      usagePulseUntil.delete(hash);
      return false;
    }
    function renderAccount(a, pulseJson) {
      const card = el("article", "acct");
      const top = el("div", "acct-top");
      const head = el("div", "acct-head");
      head.appendChild(el("div", "acct-email", a.account_label || a.account_hash));
      const tools = el("div", "acct-tools");
      const refreshBtn = iconBtn("refresh", "刷新套餐用量");
      refreshBtn.onclick = () => refreshAccount(a.account_hash, refreshBtn);
      const jsonBtn = iconBtn("braces", pulseJson ? "用量已更新" : "查看原始 JSON");
      if (pulseJson) {
        jsonBtn.classList.add("pulse");
        const clearPulse = () => {
          jsonBtn.classList.remove("pulse");
          jsonBtn.title = "查看原始 JSON";
          jsonBtn.setAttribute("aria-label", "查看原始 JSON");
        };
        jsonBtn.addEventListener("animationend", clearPulse, { once: true });
        setTimeout(clearPulse, 1800);
      }
      jsonBtn.onclick = () => openJson(a);
      tools.appendChild(refreshBtn);
      tools.appendChild(jsonBtn);
      head.appendChild(tools);
      top.appendChild(head);
      const chips = el("div", "chips");
      if (a.membership) chips.appendChild(el("span", "chip on", a.membership));
      if (a.subscription_status) {
        const st = String(a.subscription_status);
        chips.appendChild(el("span", "chip" + (st === "active" ? " on" : ""), st));
      }
      if (a.from_ide) chips.appendChild(el("span", "chip warn", "本机 IDE"));
      if (a.stored) chips.appendChild(el("span", "chip", "已导入"));
      top.appendChild(chips);
      card.appendChild(top);

      const apiMeter = meter("API", a.api_percent);
      const autoMeter = meter("Auto", a.auto_percent);
      if (apiMeter || autoMeter || a.billing_cycle_end || a.bonus_cents || a.plan_used != null) {
        const box = el("div", "usage");
        if (apiMeter) box.appendChild(apiMeter);
        if (autoMeter) box.appendChild(autoMeter);
        const bits = [];
        if (a.plan_used != null) bits.push("已用 " + fmtUsd(a.plan_used));
        if (a.bonus_cents) bits.push("赠额 " + fmtUsd(a.bonus_cents));
        if (a.billing_cycle_end) bits.push("账期至 " + String(a.billing_cycle_end).slice(0, 10));
        if (bits.length) box.appendChild(el("div", "meta", bits.join(" · ")));
        card.appendChild(box);
      }

      const foot = el("div", "acct-foot");
      const exp = fmtExp(a.exp);
      const expEl = el("div", "meta", exp.text);
      if (exp.kind === "bad") expEl.style.color = "var(--rose)";
      if (exp.kind === "warn") expEl.style.color = "var(--amber)";
      foot.appendChild(expEl);
      const actions = el("div", "chips");
      if (a.from_ide && !a.stored) {
        const add = el("button", "btn primary", "加入采集");
        add.onclick = () => importIde();
        actions.appendChild(add);
      }
      if (a.stored) {
        const del = el("button", "btn danger", "删除");
        del.onclick = async () => {
          if (!confirm("从本机采集列表删除该账号？")) return;
          try {
            await api("/v1/cursor/accounts/" + encodeURIComponent(a.account_hash), { method: "DELETE" });
            if (jsonHash === a.account_hash) closeJson();
            setMsg("acct-msg", "已删除", "ok");
            refresh();
          } catch (e) { setMsg("acct-msg", e.message, "err"); }
        };
        actions.appendChild(del);
      }
      foot.appendChild(actions);
      card.appendChild(foot);
      return card;
    }
    function normUrl(u) {
      return String(u || "").trim().replace(/\/+$/, "");
    }
    function destRow(d) {
      const row = el("div", "dest-row");
      const urlIn = document.createElement("input");
      urlIn.type = "text";
      urlIn.className = "dest-url";
      urlIn.value = d.url || "";
      urlIn.placeholder = "http://127.0.0.1:3847";
      urlIn.autocomplete = "off";
      urlIn.oninput = () => { destsDirty = true; };
      const tokIn = document.createElement("input");
      tokIn.type = "password";
      tokIn.className = "dest-token";
      tokIn.placeholder = d.token_prefix ? (d.token_prefix + " 留空则保持") : "ingest token";
      tokIn.autocomplete = "off";
      tokIn.oninput = () => { destsDirty = true; };
      const sync = iconBtn("refresh", "增量同步到此地址");
      sync.onclick = () => syncOne(urlIn.value.trim(), sync);
      const del = iconBtn("x", "删除此地址");
      del.onclick = () => {
        destsDirty = true;
        row.remove();
        refreshDestRemoveButtons();
      };
      row.appendChild(urlIn);
      row.appendChild(tokIn);
      row.appendChild(sync);
      row.appendChild(del);
      return row;
    }
    function refreshDestRemoveButtons() {
      const rows = $("dests").querySelectorAll(".dest-row");
      rows.forEach((row) => {
        const btns = row.querySelectorAll(".icon-btn");
        if (btns[1]) btns[1].disabled = rows.length <= 1;
      });
    }
    function paintDests(s) {
      if (destsDirty) return;
      const box = $("dests");
      box.innerHTML = "";
      const list = s.destinations && s.destinations.length
        ? s.destinations
        : [{ url: s.url || "", token_prefix: s.token_prefix || "" }];
      list.forEach((d) => box.appendChild(destRow(d)));
      refreshDestRemoveButtons();
    }
    function collectDests() {
      return [...$("dests").querySelectorAll(".dest-row")].map((row) => ({
        url: row.querySelector(".dest-url").value.trim(),
        token: row.querySelector(".dest-token").value.trim(),
      })).filter((d) => d.url);
    }
    async function syncOne(url, btn) {
      url = normUrl(url);
      if (!url) {
        setMsg("cfg-msg", "请先填写看板地址", "err");
        return;
      }
      const saved = ((lastStatus && lastStatus.destinations) || []).some((d) => normUrl(d.url) === url);
      if (!saved) {
        setMsg("cfg-msg", "请先保存该地址", "err");
        return;
      }
      btn.disabled = true;
      btn.classList.add("spin");
      try {
        await api("/v1/sync", { method: "POST", body: JSON.stringify({ url }) });
        setMsg("cfg-msg", "已请求增量同步", "ok");
        setTimeout(refresh, 800);
      } catch (e) {
        setMsg("cfg-msg", e.message, "err");
      } finally {
        btn.disabled = false;
        btn.classList.remove("spin");
      }
    }
    function render(s) {
      if (!cfgDirty) {
        $("hostname").value = s.hostname || "";
        $("interval_local").value = s.interval_local || "";
        $("interval_cursor").value = s.interval_cursor || "";
        $("upload_project").checked = !!s.upload_project;
      }
      paintDests(s);
      $("kpi-panel").textContent = s.panel || s.bind || "—";
      const tools = $("tools");
      tools.innerHTML = "";
      (s.tools || []).forEach((t) => tools.appendChild(toolMark(t)));
      const sync = $("kpi-sync");
      sync.innerHTML = "";
      sync.appendChild(syncLine("agent", s.last_sync_agent));
      sync.appendChild(syncLine("cursor", s.last_sync_cursor));
      paintAccounts(s);
    }
    function paintAccounts(s) {
      const grid = $("accounts");
      grid.innerHTML = "";
      const list = s.cursor_accounts || [];
      const live = new Set(list.map((a) => a.account_hash));
      for (const hash of [...usageFp.keys()]) {
        if (!live.has(hash)) {
          usageFp.delete(hash);
          usagePulseUntil.delete(hash);
          usageForcePulse.delete(hash);
        }
      }
      if (!list.length) {
        grid.appendChild(el("div", "empty", "尚未挂 Cursor 账号。点右上角 + 粘贴凭证或上传 JSON。"));
      } else {
        list.forEach((a) => {
          const pulse = markUsagePulse(a.account_hash, usageFingerprint(a));
          grid.appendChild(renderAccount(a, pulse));
        });
      }
      if (jsonHash && $("json-dlg").open) {
        const a = list.find((x) => x.account_hash === jsonHash);
        if (a) fillJson(a);
        else closeJson();
      }
    }
    async function refresh() {
      const s = await api("/v1/status");
      lastStatus = s;
      render(s);
    }
    async function refreshAccount(hash, btn) {
      btn.disabled = true;
      btn.classList.add("spin");
      try {
        await api("/v1/cursor/accounts/" + encodeURIComponent(hash) + "/refresh", { method: "POST" });
        usageForcePulse.add(hash);
        await refresh();
      } catch (e) {
        setMsg("acct-msg", e.message, "err");
        btn.disabled = false;
        btn.classList.remove("spin");
      }
    }
    function fillJson(a) {
      $("json-title").textContent = a.account_label || a.account_hash;
      $("json-sub").textContent = "GET /api/usage-summary";
      $("json-body").textContent = a.usage_raw
        ? JSON.stringify(a.usage_raw, null, 2)
        : "尚未拉到 usage-summary。点刷新后再看。";
    }
    function openJson(a) {
      jsonHash = a.account_hash;
      fillJson(a);
      $("json-dlg").showModal();
    }
    function closeJson() {
      jsonHash = null;
      if ($("json-dlg").open) $("json-dlg").close();
    }
    function closeDlg() {
      $("add-dlg").close();
      $("token").value = "";
      $("file").value = "";
      fileText = "";
      fileName = "";
      $("file-label").textContent = "点击或拖放 JSON 文件到这里";
      setMsg("dlg-msg", "");
    }
    function openDlg() {
      setMsg("dlg-msg", "");
      $("add-dlg").showModal();
      $("token").focus();
    }
    async function importIde() {
      try {
        const r = await api("/v1/cursor/accounts", { method: "POST", body: JSON.stringify({ import_ide: true }) });
        setMsg("acct-msg", "已导入当前 IDE 登录", "ok");
        closeDlg();
        refresh();
        return r;
      } catch (e) {
        setMsg("dlg-msg", e.message, "err");
        setMsg("acct-msg", e.message, "err");
      }
    }
    function payloadText() {
      const pasted = $("token").value.trim();
      if (fileText) return fileText;
      return pasted;
    }
    $("json-close").appendChild(svgIcon(ICONS.x));
    $("json-close").onclick = closeJson;
    $("json-dlg").addEventListener("click", (e) => {
      if (e.target === $("json-dlg")) closeJson();
    });
    $("json-dlg").addEventListener("close", () => { jsonHash = null; });
    $("add-open").onclick = openDlg;
    $("add-cancel").onclick = (e) => { e.preventDefault(); closeDlg(); };
    $("add-dlg").addEventListener("click", (e) => {
      if (e.target === $("add-dlg")) closeDlg();
    });
    $("import-ide").onclick = (e) => { e.preventDefault(); importIde(); };
    $("add-form").onsubmit = async (e) => {
      e.preventDefault();
      const token = payloadText();
      if (!token) {
        setMsg("dlg-msg", "请粘贴凭证或选择文件", "err");
        return;
      }
      $("add-submit").disabled = true;
      try {
        const r = await api("/v1/cursor/accounts", { method: "POST", body: JSON.stringify({ token }) });
        const n = r.added || 0;
        setMsg("acct-msg", n ? ("已导入 " + n + " 个账号") : "已添加", "ok");
        closeDlg();
        refresh();
      } catch (err) {
        setMsg("dlg-msg", err.message, "err");
      } finally {
        $("add-submit").disabled = false;
      }
    };
    function takeFile(file) {
      if (!file) return;
      fileName = file.name || "upload.json";
      const reader = new FileReader();
      reader.onload = () => {
        fileText = String(reader.result || "");
        $("file-label").textContent = fileName + " · " + fileText.length + " 字节";
        setMsg("dlg-msg", "已读取文件，点添加以提取凭证", "ok");
      };
      reader.onerror = () => setMsg("dlg-msg", "读取文件失败", "err");
      reader.readAsText(file);
    }
    $("file").onchange = () => takeFile($("file").files && $("file").files[0]);
    const drop = $("drop");
    ["dragenter", "dragover"].forEach((ev) => {
      drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); });
    });
    ["dragleave", "drop"].forEach((ev) => {
      drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); });
    });
    drop.addEventListener("drop", (e) => {
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      takeFile(f);
    });
    ["hostname", "interval_local", "interval_cursor"].forEach((id) => {
      $(id).addEventListener("input", () => { cfgDirty = true; });
    });
    $("upload_project").addEventListener("change", () => { cfgDirty = true; });
    $("add-dest").onclick = () => {
      destsDirty = true;
      $("dests").appendChild(destRow({ url: "", token_prefix: "" }));
      refreshDestRemoveButtons();
      const rows = $("dests").querySelectorAll(".dest-url");
      const last = rows[rows.length - 1];
      if (last) last.focus();
    };
    $("save-cfg").onclick = async () => {
      try {
        const destinations = collectDests();
        if (!destinations.length) {
          setMsg("cfg-msg", "至少需要一个看板地址", "err");
          return;
        }
        await api("/v1/config", {
          method: "PUT",
          body: JSON.stringify({
            destinations,
            hostname: $("hostname").value.trim(),
            upload_project: $("upload_project").checked,
            interval_local: $("interval_local").value.trim(),
            interval_cursor: $("interval_cursor").value.trim(),
          }),
        });
        cfgDirty = false;
        destsDirty = false;
        setMsg("cfg-msg", "已保存，新地址将全量同步", "ok");
        refresh();
      } catch (e) { setMsg("cfg-msg", e.message, "err"); }
    };
    $("sync-now").onclick = async () => {
      setMsg("sync-msg", "同步中…");
      try {
        await api("/v1/sync", { method: "POST", body: "{}" });
        setMsg("sync-msg", "已请求同步", "ok");
        setTimeout(refresh, 800);
      } catch (e) { setMsg("sync-msg", e.message, "err"); }
    };
    refresh().catch((e) => {
      $("page-err").hidden = false;
      $("page-err").textContent = e.message;
    });
    setInterval(() => refresh().catch(() => {}), 8000);
  </script>
</body>
</html>
